name: revisor

# Llama al juez reutilizable de la Fábrica (factory-am89/fabrica). Corre con pull_request_target: ejecuta
# la versión de este fichero que está en main, no la del PR. Los secretos (CLAUDE_CODE_OAUTH_TOKEN,
# REVISOR_CLIENT_ID y REVISOR_APP_KEY) viven en el environment `revisor` de este repo, limitado a main.
# Lo crea apps/proyecto-nuevo.ps1.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  revisor:
    uses: factory-am89/fabrica/.github/workflows/revisor.yml@main
    with:
      # Slug de la App de revisor de este repo (la que crea la Fábrica por defecto); si el repo usa otra App, cámbialo.
      revisor-app-slug: fabrica-revisor
    # Solo los tres que el juez usa, por nombre: GitHub exige que el llamador los pase aunque vivan solo en el environment
    # `revisor`, y la forma «inherit» entregaría además todos los demás secretos de este repo a un workflow de otro repo.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVISOR_CLIENT_ID: ${{ secrets.REVISOR_CLIENT_ID }}
      REVISOR_APP_KEY: ${{ secrets.REVISOR_APP_KEY }}
