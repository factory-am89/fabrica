name: anulacion

# La anulación por Pablo: la única salida cuando el revisor rechaza por error (pausar el ruleset está prohibido).
# Pablo pulsa «Approve» en la pestaña Files changed del PR; este workflow lo comprueba y, si es suya y de la
# cabeza actual, publica el check `revisor` en verde con el título «override by Pablo» (scripts/veredicto.mjs,
# MODO=anulacion; la regla está allí, en aprobacionDePablo).
#
# Por qué workflow_run y no pull_request_review: pull_request_review ejecuta el workflow tal como lo trae el PR y su
# rama no puede usar el environment `revisor` (limitado a main). workflow_run corre siempre la versión de main, con
# el código de main, y despierta tras senal-review.yml, que no tiene secretos. Aquí NUNCA se baja el código del PR:
# el único checkout es el de la Fábrica (job.workflow_sha) y el PR solo se lee por API.
#
# También es reutilizable (workflow_call): otro repo lo llama con
#   uses: factory-am89/fabrica/.github/workflows/anulacion.yml@main
#   secrets: inherit
# desde un workflow suyo con `on: workflow_run` tras su propio senal-review (el job lee github.event.workflow_run)
# y con permiso contents: read (un workflow llamado no puede subirlos). Los dos secretos y el
# environment `revisor` los define el repo que llama: el check se publica con SU App, nunca con unas fijas de la
# Fábrica. En un workflow reutilizable `github.repository` y `github.event` son los del repo que llama; por eso el
# juez (veredicto.mjs) se baja siempre de la Fábrica a `.fabrica/`.
on:
  workflow_run:
    workflows: [senal-review]
    types: [completed]
  workflow_call:
    inputs:
      # Slug de la App de revisor del repo que llama: veredicto.mjs solo cuenta los check `revisor` de esa App.
      revisor-app-slug:
        type: string
        required: false
        default: fabrica-revisor
    secrets:
      REVISOR_CLIENT_ID:
        required: true
      REVISOR_APP_KEY:
        required: true

# No cancela una anulación en curso (otra review llegada a la vez); sí espera a la anterior del mismo PR.
concurrency:
  group: anulacion-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

permissions: {}

jobs:
  anular:
    # Solo PR de ramas del propio repo con la review ya enviada: un fork no recibe nuestros secretos.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request_review'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: revisor
    permissions:
      contents: read
    steps:
      # El juez, siempre de la Fábrica y en el mismo commit de este workflow (job.workflow_sha: el del fichero
      # que define el job, no el del repo que llama). La Fábrica es pública: no hace falta token propio.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: factory-am89/fabrica
          ref: ${{ job.workflow_sha }}
          path: .fabrica
          persist-credentials: false

      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.REVISOR_CLIENT_ID }}
          private-key: ${{ secrets.REVISOR_APP_KEY }}
          permission-pull-requests: read
          permission-checks: write

      - run: node .fabrica/scripts/veredicto.mjs
        env:
          MODO: anulacion
          REVISOR_APP_SLUG: ${{ inputs.revisor-app-slug || 'fabrica-revisor' }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          TOKEN: ${{ steps.app.outputs.token }}
