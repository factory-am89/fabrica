name: administrar

# El unico workflow que usa la clave de la App fabrica-administrador (plans/app-admin.md, punto 2). test/administrador.test.js
# vigila: solo estos disparadores, permisos del workflow exactamente contents: read, y los permisos de CADA token un
# subconjunto, clave y nivel, de los del manifiesto de la App (nunca una clave que la App no tiene ni un nivel mas alto).
#
# Cada paso pide solo lo que necesita:
#   lectura   token solo de lectura: lee el estado real y alimenta el plan (leer-plan.mjs) y la segunda lectura de secretos.mjs.
#   escritura administration: write (crear el environment y su politica de ramas) y environments: write (clave publica y
#             secretos del environment; la tabla de permisos de GitHub pide `environments`, no `secrets`), metadata: read.
# Trozo 4: leer-plan.mjs imprime en el resumen lo que le falta a cada repo de proyectos/ y solo envia GET.
# Trozo 8: crear.mjs (token de escritura, el mismo del paso de secretos) crea los repos nuevos antes de todo lo demas.
# Trozo 5: secretos.mjs escribe el environment `revisor` y sus tres secretos (cifrados) y nada mas del plan.
# Trozo 6: aplicar.mjs (paso `aplicar`: token con administration, contents y workflows en write) ajusta, sube los ficheros a main y
#          crea o completa el ruleset; solo corre si el paso de secretos acabo bien.
# Trozo 7: humo.mjs (paso `humo`: token con contents y pull_requests en write) abre el PR de la ficha .fabrica.json y arma su fusion
#          automatica; va despues de aplicar, sin `if`, y solo ese paso usa su token.
# Los tres valores viven en el environment `administrador` de esta repo; si falta alguno, el paso falla ANTES de escribir
# y dice los NOMBRES que faltan (nunca valores). El ultimo paso falla el run si el log propio contiene una clave privada.
on:
  push:
    branches: [main]
    paths: [proyectos/**, scripts/admin/**]

permissions:
  contents: read

concurrency:
  group: administrar
  cancel-in-progress: false

jobs:
  administrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los secretos viven en este environment, limitado a la rama main: una rama no puede desplegar en el.
    environment: administrador
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # secretos.mjs usa libsodium (cifrar con la clave publica del environment). Antes de acuñar ningun token y sin scripts de instalacion.
      - run: npm ci --ignore-scripts

      # Copia de lo que imprimen los pasos de abajo, para el ultimo paso.
      - run: touch "$RUNNER_TEMP/administrar.log"

      - id: lectura
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.ADMIN_APP_KEY }}
          # Sin owner la accion limita el token al repo actual: no veria los proyectos.
          owner: factory-am89
          permission-actions: read
          permission-contents: read
          permission-environments: read
          permission-pull-requests: read
          permission-metadata: read

      # Lee el estado real (solo GET) e imprime el plan en el resumen del job.
      - run: node scripts/admin/leer-plan.mjs 2>&1 | tee -a "$RUNNER_TEMP/administrar.log"
        env:
          GH_TOKEN: ${{ steps.lectura.outputs.token }}

      - id: escritura
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.ADMIN_APP_KEY }}
          owner: factory-am89
          permission-administration: write
          permission-environments: write
          permission-metadata: read

      # Trozo 8. Crea los repos de proyectos/ que aun no existen (crear.mjs, auto_init: nace con un primer commit en main). Va ANTES de los secretos, que
      # exigen el repo, y SIN `if` ni continue-on-error: si crear falla, no se escribe nada mas. Usa el token de escritura de arriba tal cual: GitHub documenta
      # `administration: write` para POST /orgs/{org}/repos (tabla de permisos server-to-server), asi que no se anade ningun permiso. test/admin-crear.test.js lo vigila.
      - id: crear
        run: node scripts/admin/crear.mjs 2>&1 | tee -a "$RUNNER_TEMP/administrar.log"
        env:
          GH_TOKEN_LECTURA: ${{ steps.lectura.outputs.token }}
          GH_TOKEN_ESCRITURA: ${{ steps.escritura.outputs.token }}

      # Escribe el environment `revisor` (solo main) y sus tres secretos cifrados en cada repo de proyectos/.
      - id: secretos
        run: node scripts/admin/secretos.mjs 2>&1 | tee -a "$RUNNER_TEMP/administrar.log"
        env:
          GH_TOKEN_LECTURA: ${{ steps.lectura.outputs.token }}
          GH_TOKEN_ESCRITURA: ${{ steps.escritura.outputs.token }}
          REVISOR_APP_KEY: ${{ secrets.REVISOR_APP_KEY }}
          REVISOR_CLIENT_ID: ${{ secrets.REVISOR_CLIENT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ORIGEN_SECRETOS: el environment `administrador` de factory-am89/fabrica (Settings, Environments)

      # Trozo 6. Va DESPUES del paso de secretos y SIN `if` ni continue-on-error: si los secretos fallan (faltan valores, un 403), este
      # paso y su token no se ejecutan y main no se protege (proteger sin los secretos del environment revisor dejaria sus PR bloqueados).
      # Ademas aplicar.mjs vuelve a leer y se niega si el environment no tiene los tres nombres. test/admin-aplicar.test.js vigila el orden.
      - id: aplicar
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.ADMIN_APP_KEY }}
          owner: factory-am89
          # Ajustes y ruleset (administration), ficheros directos a main (contents) y los de .github/workflows (workflows).
          permission-administration: write
          permission-contents: write
          permission-workflows: write
          permission-metadata: read

      # Ajustes, ficheros directos en main y ruleset de main de cada repo de proyectos/, en ese orden. Nunca pausa ni borra un ruleset.
      - run: node scripts/admin/aplicar.mjs 2>&1 | tee -a "$RUNNER_TEMP/administrar.log"
        env:
          GH_TOKEN_LECTURA: ${{ steps.lectura.outputs.token }}
          GH_TOKEN_APLICAR: ${{ steps.aplicar.outputs.token }}

      # Trozo 7. Va DESPUES de aplicar.mjs y SIN `if` ni continue-on-error: si aplicar falla, main no esta protegida ni tiene sus ficheros y no se abre ningun PR.
      # Su token tiene lo minimo: contents (la rama y la ficha en ella) y pull_requests (abrir el PR y armar su fusion). test/admin-humo.test.js lo vigila.
      - id: humo
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.ADMIN_APP_KEY }}
          owner: factory-am89
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      # La rama ops/fabrica-ficha con .fabrica.json, el PR y la fusion automatica; GitHub fusiona cuando tests y revisor estan en verde.
      - run: node scripts/admin/humo.mjs 2>&1 | tee -a "$RUNNER_TEMP/administrar.log"
        env:
          GH_TOKEN_LECTURA: ${{ steps.lectura.outputs.token }}
          GH_TOKEN_HUMO: ${{ steps.humo.outputs.token }}

      # Falla el run si lo que imprimieron los pasos de arriba contiene una clave privada. Solo mira lo que imprimen nuestros
      # scripts (el log de GitHub enmascara los secretos por su cuenta); corre siempre, tambien si el paso de secretos fallo.
      - if: always()
        run: |
          set +e
          grep -q 'PRIVATE KEY' "$RUNNER_TEMP/administrar.log"
          codigo=$?
          if [ "$codigo" -eq 0 ]; then echo "::error::lo impreso por los pasos de este run contiene una clave privada"; exit 1; fi
          if [ "$codigo" -ne 1 ]; then echo "::error::no se pudo leer el log propio (grep dio $codigo)"; exit "$codigo"; fi
          echo "El log propio no contiene una clave privada."
