name: tests

# Corre en la propia Fábrica (pull_request y push a main) y, como workflow reutilizable
# (workflow_call), sobre el repo que lo llama:
#   jobs:
#     tests:
#       uses: factory-am89/fabrica/.github/workflows/tests.yml@main
# desde un workflow suyo con `on: pull_request` (y `permissions: contents: read`). Sin secretos.
#
# Qué exige al repo que llama (si falta algo, el job FALLA; no se salta nada en silencio):
#   - package-lock.json (lo exigen `npm ci` y `cache: npm`) y un script `test` en package.json.
#   - Nada de lint: se aplica la configuración de la Fábrica (eslint.config.js) con el ESLint de
#     la Fábrica; el repo que llama no necesita ESLint, ni su script lint, ni su configuración.
#   - Sus workflows pasan las reglas de máquina de la Fábrica (YAML válido, permissions, acciones
#     por SHA salvo la excepción de C4): test/workflows.test.js apuntando a su carpeta.
# En un workflow reutilizable `github.repository` es el del repo que llama, y el checkout sin
# parámetros baja ese repo: es el que se comprueba. La Fábrica se baja aparte a `.fabrica/`
# (siempre, también en la propia Fábrica: un solo camino) en el commit de este workflow
# (job.workflow_sha) y DESPUÉS de correr los tests del repo, para que su `npm test` no la vea.
on:
  pull_request:
    # edited: editing the PR body re-runs the body check at the end of the job.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: factory-am89/fabrica
          ref: ${{ job.workflow_sha }}
          path: .fabrica
          persist-credentials: false
      - name: Instalar las herramientas de la Fábrica
        run: npm ci --prefix .fabrica
      - name: Lint con la configuración de la Fábrica
        run: .fabrica/node_modules/.bin/eslint --config .fabrica/eslint.config.js . --max-warnings 0
      - name: Reglas de máquina sobre los workflows del repo
        run: node --test .fabrica/test/workflows.test.js
        env:
          FABRICA_REPO_A_COMPROBAR: ${{ github.workspace }}

      # PR body check, only in the Factory itself: in a calling repo github.repository is theirs, so the
      # step is skipped on purpose (test/tests-reutilizable.test.js pins this). Everything comes in through
      # env: the body is untrusted text and must never be interpolated into the script.
      - name: PR body has the template sections
        if: github.event_name == 'pull_request' && github.repository == 'factory-am89/fabrica'
        run: |
          gh api "repos/$REPO/compare/$BASE...$SHA" > "$RUNNER_TEMP/compare.json"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node .fabrica/scripts/pr-body.mjs --body-file "$RUNNER_TEMP/pr-body.md" --compare-file "$RUNNER_TEMP/compare.json"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}

      # Plan PR check, same scope as the step above (Factory only, pull_request only). A PR that touches
      # plans/ must change exactly one plans/<slug>.md and nothing else, and that plan must pass check-plan.
      # It downloads its own compare.json so the two steps stay independent. Form only, not content.
      - name: A PR that touches plans/ changes exactly one valid plan
        if: github.event_name == 'pull_request' && github.repository == 'factory-am89/fabrica'
        run: |
          gh api "repos/$REPO/compare/$BASE...$SHA" > "$RUNNER_TEMP/plan-compare.json"
          node .fabrica/scripts/check-plan.mjs --compare-file "$RUNNER_TEMP/plan-compare.json"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
