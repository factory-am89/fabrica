name: senal-review

# Solo despierta a anulacion.yml cuando alguien envía una review en un PR. No hace nada más y no recibe
# secretos: `pull_request_review` ejecuta la versión de este fichero que trae el PR (no la de main), así que
# lo que valga algo se decide en anulacion.yml, que corre desde main y lo comprueba todo por la API.
#
# También es reutilizable (workflow_call): otro repo lo llama con
#   factory-am89/fabrica/.github/workflows/senal-review.yml@main (como `uses`)
# desde un workflow suyo con `on: pull_request_review` llamado también `senal-review` (anulacion.yml espera ese
# nombre). No declara secretos ni inputs: no usa credenciales de nadie, ni de la Fábrica ni del repo que llama.
on:
  pull_request_review:
    types: [submitted]
  workflow_call:

permissions: {}

jobs:
  senal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "review enviada; anulacion.yml la comprueba"
